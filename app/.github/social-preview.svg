<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- The repository's social preview, drawn in the app's own palette and type: every colour
       is a token from src/app.css, set in Archivo and IBM Plex Mono. The text is laid out
       for those faces, so render it with them loaded (the @fontsource files in
       node_modules), not as a bare SVG with system fallbacks. -->
  <defs>
    <!-- Ground: surface-0, lifting to surface-1 across the middle. -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1013"/>
      <stop offset="55%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <!-- Accent, fading out: mint is the live identity, blue is kept for the room speaker. -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad1a0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#5ad1a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5ad1a0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ad1a0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5ad1a0" stop-opacity="0"/>
    </radialGradient>
    <!-- The live dot's halo, as the status pill draws it in the toolbar. -->
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1120" cy="120" rx="420" ry="300" fill="url(#glow)"/>

  <!-- App mark: src-tauri/icons/source.svg at 100 px -->
  <g transform="translate(80,54) scale(0.09765625)">
    <defs>
      <linearGradient id="markTile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#191d23"/>
        <stop offset="1" stop-color="#0e1013"/>
      </linearGradient>
      <radialGradient id="markGlow" cx="0.25" cy="0.2" r="0.9">
        <stop offset="0" stop-color="#5ad1a0" stop-opacity="0.16"/>
        <stop offset="0.6" stop-color="#5ad1a0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1024" height="1024" rx="224" fill="url(#markTile)"/>
    <rect width="1024" height="1024" rx="224" fill="url(#markGlow)" stroke="#262b33" stroke-width="15"/>
    <g fill="none" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
      <path stroke="#5ad1a0" d="M184 496 C222 496 232 344 280 344 C330 344 340 648 390 648 C436 648 444 428 486 428 C524 428 530 544 562 544 C586 544 592 496 620 496 L840 496"/>
      <path stroke="#e9ebef" d="M500 680 L840 680"/>
    </g>
  </g>

  <!-- Wordmark: text-bright over text-secondary. -->
  <g font-family="Archivo, 'Segoe UI', sans-serif">
    <text x="212" y="104" font-size="54" font-weight="600" fill="#f2f4f7"
          letter-spacing="-1.08">Live Translation &amp; Subtitles</text>
    <text x="212" y="144" font-size="23" font-weight="400" fill="#c3c9d2">Live captions and translation over your meetings, video calls and slides</text>
  </g>

  <rect x="80" y="192" width="1120" height="2" fill="url(#rule)"/>

  <!-- Mock caption panel: a translated caption, still arriving, with the original speech
       beneath it. surface-1 with a line-strong edge, rounded like a flyout. -->
  <g transform="translate(80,226)">
    <rect width="1120" height="254" rx="12" fill="#111419" stroke="#262b33" stroke-width="1.5"/>

    <!-- The toolbar's Live pill: accent wash and border, accent-soft label at the caps
         tracking, and the session clock in mono. -->
    <rect x="40" y="26" width="192" height="36" rx="18" fill="#5ad1a0" fill-opacity="0.08"
          stroke="#5ad1a0" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="58" cy="44" r="6" fill="#5ad1a0" filter="url(#halo)"/>
    <circle cx="58" cy="44" r="6" fill="#5ad1a0"/>
    <text x="76" y="50" font-family="Archivo, 'Segoe UI', sans-serif" font-size="17"
          font-weight="600" letter-spacing="2.04" fill="#7fdcb6">LIVE</text>
    <text x="134" y="50" font-family="'IBM Plex Mono', Consolas, monospace" font-size="17"
          font-weight="600" fill="#7fdcb6">00:12:43</text>

    <text x="260" y="51" font-family="'IBM Plex Mono', Consolas, monospace" font-size="19"
          font-weight="500" fill="#c3c9d2">DE &#8594; EN</text>
    <text x="372" y="51" font-family="Archivo, 'Segoe UI', sans-serif" font-size="19"
          font-weight="400" fill="#8b93a1">system audio &#183; always-on-top overlay</text>

    <g font-family="Archivo, 'Segoe UI', sans-serif">
      <text x="40" y="120" font-size="38" font-weight="600" letter-spacing="-0.57" fill="#f2f4f7">On the next slide, the results from all six</text>
      <text x="40" y="166" font-size="38" font-weight="600" letter-spacing="-0.57" fill="#f2f4f7">countries, starting with Benin.</text>
      <!-- The interim caret: the line is still arriving. -->
      <rect x="549" y="135" width="4" height="34" fill="#5ad1a0"/>
      <text x="40" y="214" font-size="24" font-weight="400" fill="#8b93a1">Auf der n&#228;chsten Folie die Ergebnisse aus allen sechs L&#228;ndern, zuerst Benin.</text>
    </g>
  </g>

  <!-- What it does: surface-2 chips with a line-strong edge, text-secondary labels. -->
  <g font-family="Archivo, 'Segoe UI', sans-serif" font-size="21" font-weight="500" fill="#c3c9d2" text-anchor="middle">
    <rect x="80" y="522" width="202" height="46" rx="8" fill="#191d23" stroke="#262b33" stroke-width="1.5"/>
    <text x="181" y="552">Offline Whisper</text>

    <rect x="298" y="522" width="293" height="46" rx="8" fill="#191d23" stroke="#262b33" stroke-width="1.5"/>
    <text x="444.5" y="552">Gemini &#183; OpenAI &#183; Mistral</text>

    <rect x="607" y="522" width="268" height="46" rx="8" fill="#191d23" stroke="#262b33" stroke-width="1.5"/>
    <text x="741" y="552">SRT &#183; VTT &#183; Markdown</text>

    <rect x="891" y="522" width="309" height="46" rx="8" fill="#191d23" stroke="#262b33" stroke-width="1.5"/>
    <text x="1045.5" y="552">Windows 11 &#183; x64 &#183; ARM64</text>
  </g>
</svg>
