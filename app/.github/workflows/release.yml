name: Release installers

# Builds the x64 one-click installers and attaches them to the GitHub release, then packages
# native x64 and ARM64 MSIX packages and combines them into one unsigned multi-architecture
# .msixbundle for the Microsoft Store (see docs/microsoft-store.md, docs/packaging-msix.md
# and docs/store-updates.md).
#
# The ordinary installer remains x64. Store packages are x64 + native ARM64 because every
# cloud-provider path is architecture-native.
#
# Release assets: Live.Translation_<version>_<arch>.msix  — sideload/verification packages
#                 Live.Translation_<version>.msixbundle   — the Store submission artifact
#
# Normal flow:   git tag v0.1.2 && git push origin v0.1.2  -> builds + publishes.
# Backfill a tag: run this workflow manually (Actions tab -> Run workflow) and pass
# an existing tag (e.g. v0.1.1) to add the other platforms' installers to it.
#
# Submitting the bundle to the Store is done by hand in Partner Center — the submission API is
# a Company-account feature and this is an Individual account. docs/store-updates.md has the
# route and the reason.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build installers for (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # x64 Windows
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure native Whisper compiler
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: whisper-cpu-x64-v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish installers to the release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          # A hyphenated tag (v1.0.0-rc1, v0.5.4-arm64-check) is a pre-release or a build
          # validation, so it stays an unpublished draft until a human promotes it. Plain
          # version tags publish as before.
          releaseDraft: ${{ contains(inputs.tag || github.ref_name, '-') }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          args: --target ${{ matrix.target }}

  # Microsoft Store package. Tauri has no MSIX bundle target, so @choochmeque/tauri-windows-bundle
  # drives `tauri build --no-bundle` and then packs the payload with the Windows SDK's MakeAppx
  # (it finds the SDK through HKLM\SOFTWARE\Microsoft\Windows Kits\Installed Roots, which is
  # populated on windows-latest — nothing to install). The package is left unsigned on purpose:
  # the Store re-signs it, and an unsigned package is what Partner Center expects.
  #
  # Runs after `build` because it uploads to the release that job creates. Each architecture
  # has its own Rust cache.
  msix:
    name: MSIX package (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure native Whisper compiler
        shell: pwsh
        run: |
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CXX=clang-cl" >> $env:GITHUB_ENV
          "CXXFLAGS=/EHsc" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the native Windows package lanes separate. Bump with `.cargo/config.toml`:
          # whisper-rs-sys does not rebuild ggml when its GGML_* variables change.
          prefix-key: whisper-cpu-${{ matrix.arch }}-v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Writes an architecture-specific .msix and a single-architecture .msixbundle wrapper.
      # Only the bare .msix is kept: the `bundle` job below combines both architectures into
      # the one multi-architecture bundle the Store submission wants.
      - name: Build MSIX package
        run: npm run bundle:msix:${{ matrix.arch }}

      # msixbundle-cli names its output after the manifest DisplayName ("Live Translation &
      # Subtitles"), which makes a poor release asset, so rename to the convention the NSIS
      # and MSI assets already follow.
      - name: Name the package
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msix = Get-ChildItem 'src-tauri/target/msix' | Where-Object Extension -eq '.msix' | Select-Object -First 1
          if (-not $msix) { throw 'tauri-windows-bundle produced no .msix.' }
          $msixAsset = Join-Path 'src-tauri/target/msix' "Live.Translation_${version}_${{ matrix.arch }}.msix"
          Move-Item -LiteralPath $msix.FullName -Destination $msixAsset -Force
          "msix=$msixAsset" >> $env:GITHUB_OUTPUT

      # The bare .msix is what a tester signs and installs locally (scripts/install-local-msix.ps1):
      # signing a bundle does not sign the packages inside it, so a bundle cannot be side-loaded
      # for verification.
      - name: Attach the MSIX to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ inputs.tag || github.ref_name }}"
          "${{ steps.package.outputs.msix }}" --clobber

      # Handed to the `bundle` job, which needs both architectures on one runner.
      - name: Upload the MSIX for bundling
        uses: actions/upload-artifact@v7
        with:
          name: msix-${{ matrix.arch }}
          path: ${{ steps.package.outputs.msix }}
          retention-days: 1
          if-no-files-found: error

  # One multi-architecture .msixbundle carrying both packages. This is the Store submission
  # artifact, and it has to be a single file: `msstore publish` uploads one package and marks
  # only the first existing package with a matching extension for deletion, so two separate
  # single-architecture bundles would leave a stale one behind on every update
  # (docs/store-updates.md).
  bundle:
    name: Store bundle (x64 + ARM64)
    needs: msix
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download both architectures
        uses: actions/download-artifact@v8
        with:
          pattern: msix-*
          path: packages
          merge-multiple: true

      - name: Bundle
        id: bundle
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          $packages = Get-ChildItem 'packages' -Filter *.msix
          if ($packages.Count -ne 2) {
            throw "Expected an x64 and an ARM64 .msix, found $($packages.Count): $($packages.Name -join ', ')"
          }

          # MakeAppx ships with the Windows SDK, which is preinstalled on windows-latest.
          # Take the highest SDK version rather than assuming one.
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found; the Windows SDK is missing.' }

          $bundle = "Live.Translation_${version}.msixbundle"
          # /bv must be a four-part version and at least as high as the packages inside it.
          & $makeAppx.FullName bundle /d 'packages' /p $bundle /bv "$version.0" /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }

          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ inputs.tag || github.ref_name }}"
          "${{ steps.bundle.outputs.bundle }}" --clobber
